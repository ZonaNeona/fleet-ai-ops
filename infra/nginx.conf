# /etc/nginx/sites-available/fleet — certbot adds the TLS server block.
server {
 listen 80;
 server_name fleet.example.com;
 root /var/www/fleet/dist;
 client_max_body_size 9m;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy same-origin;
 # Synthetic sources (1C, Yandex Pro, fines, telematics) answer only n8n on loopback.
 location /api/mock/ { return 404; }
 location /api/ {
   proxy_pass http://127.0.0.1:3008;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_buffering off;
   proxy_read_timeout 120s;
 }
 location ~ ^/(auto(/.*)?|sitemap\.xml|robots\.txt)$ {
   proxy_pass http://127.0.0.1:3008;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location / { try_files $uri $uri/ /index.html; }
 location ~ /\. { deny all; }
}
