server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 9m;
  # Synthetic sources answer only n8n inside the network.
  location /api/mock/ { return 404; }
  location /api/ {
    proxy_pass http://api:3008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  # Bitrix24 app: PHP files go to the php-fpm container, the Vue widget is static.
  location ~ ^/b24app/(.+\.php)$ {
    fastcgi_pass b24app:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/$1;
  }
  location /b24app/ { alias /usr/share/nginx/html/b24app/; }
  # The client site is rendered by the API (FastAPI + Jinja); the cabinet stays a static SPA.
  location ~ ^/(auto(/.*)?|gov(/.*)?|sitemap\.xml|robots\.txt)$ {
    proxy_pass http://api:3008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # The page shell is revalidated on every visit (it names the current bundles); hashed bundles are kept for a year.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }
  location / { try_files $uri $uri/ /index.html; }
}
