# The whole stand on one machine, no keys needed: every integration starts in emulator mode.
#   docker compose up --build        → http://localhost:8080
# AI calls need OPENROUTER_API_KEY in .env; without it the stand works, the model answers honestly report it is off.
name: fleet-ai-ops

x-app: &app
  build: .
  image: fleet-ai-ops-app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://fleet:fleet@db/fleet
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: http://localhost:8080
    FILE_ROOT: /data/files
    INTEGRATION_SECRET: ${INTEGRATION_SECRET:-local-only-not-a-secret}
    B24APP_URL: http://web/b24app
    B24_EMULATOR_URL: http://api:3008
    ROBOT_BASE: http://api:3008
    # Local model for documents with personal data: OLLAMA_URL=http://ollama:11434/v1 PII_LOCAL=1 with --profile local-llm
    OLLAMA_URL: ${OLLAMA_URL:-}
    PII_LOCAL: ${PII_LOCAL:-0}
  volumes:
    - files:/data/files
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  api:
    <<: *app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3008/api/health"]
      interval: 5s
      retries: 60
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  b24app:
    build:
      context: .
      dockerfile: b24app.Dockerfile
    environment:
      FLEET_API: http://api:3008

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      b24app:
        condition: service_started

  # OLLAMA_URL=http://ollama:11434/v1 PII_LOCAL=1 docker compose --profile local-llm up
  # then once: docker compose exec ollama ollama pull qwen2.5vl:3b  (about 3 GB; needs 8 GB of RAM, not the demo server)
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama

  # docker compose --profile observability up → Prometheus :9090 and Grafana :3000 with the «Fleet» dashboard
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:12.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pg:
  files:
  ollama:
