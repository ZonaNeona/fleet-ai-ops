name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FLEET_ENV: /dev/null
      FLEET_INTEGRATIONS_ENV: /dev/null
      DATABASE_URL: postgresql+psycopg://fleet:fleet@127.0.0.1/fleet
      PGPASSWORD: fleet
      INTEGRATION_SECRET: ci-only-not-a-secret
      REDIS_URL: redis://127.0.0.1:6379/0
      # One test client writes far faster than a person; the limits themselves have their own test.
      WRITE_LIMIT: "100000"
      SESSION_LIMIT: "100000"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get install -y --no-install-recommends libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests tools migrations
      - run: ruff format --check app scripts tests tools migrations
      - run: mypy
      - run: psql -h 127.0.0.1 -U fleet -d fleet -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: mkdir -p "$RUNNER_TEMP/files" && echo "FILE_ROOT=$RUNNER_TEMP/files" >> "$GITHUB_ENV"
      - run: alembic upgrade head
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-minilm-v1
      # The app reads embeddings from the local cache only; CI fills the cache once.
      - run: python -c "import os; from fastembed import TextEmbedding; from app.rag import MODEL; TextEmbedding(model_name=MODEL, cache_dir=os.environ['FASTEMBED_CACHE_PATH'])"
      - run: python scripts/build_kb.py
      # Retrieval quality on reference questions; the numbers go to the run summary as a notice.
      - run: python -m app.quality | sed 's/^/::notice title=retrieval quality::/'
      # Failed test names go to annotations so they are visible without opening the log.
      - run: |
          set -o pipefail
          python -m app.worker > worker.log 2>&1 &
          pytest -q --tb=line -rfE --cov=app --cov-report=term tests 2>&1 | tee pytest.log || { grep -E '^(FAILED|ERROR)|Error:|error:' pytest.log | head -40 | sed 's/^/::error::/'; tail -20 worker.log | sed 's/^/::warning::worker: /'; exit 1; }

      - run: grep -E '^TOTAL' pytest.log | sed 's/^/::notice title=coverage::/' || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build

  # Bitrix24 app: PHP syntax and tests without network, Vue widget type check and build.
  b24app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: for f in b24app/src/*.php b24app/public/*.php; do php -l "$f"; done
      - run: php b24app/tests/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd b24app/widget && npm ci && npm run build

  # The whole stand from docker-compose.yml, the way a reviewer would start it.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build and start separately; on failure the tail of the output becomes annotations (readable without a login).
      - run: |
          set -o pipefail
          docker compose build --progress plain 2>&1 | tee build.log || { tail -40 build.log | sed 's/^/::error::build: /'; exit 1; }
      - run: |
          docker compose up -d 2>&1 | tee up.log || { tail -30 up.log | sed 's/^/::error::up: /'; docker compose ps -a | sed 's/^/::error::ps: /'; exit 1; }
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 5
          done
          docker compose ps -a | sed 's/^/::warning::/'
          for s in api worker web b24app; do docker compose logs --tail 15 $s | sed "s/^/::error::$s: /"; done
          exit 1
      - run: |
          code=$(curl -sS -o session.json -w '%{http_code}' -X POST -H "Origin: http://localhost:8080" -H "Content-Type: application/json" -d '{}' http://localhost:8080/api/v1/session)
          if [ "$code" = 200 ]; then exit 0; fi
          echo "::error::POST /api/v1/session → $code: $(head -c 300 session.json)"
          docker compose logs --tail 25 api | sed 's/^/::error::api: /'
          exit 1
      - if: always()
        run: docker compose down -v

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python tools/check_private_names.py
