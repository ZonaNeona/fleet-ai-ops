[project]
name = "fleet-ai-ops"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", "dist"]

[tool.ruff.lint]
# Errors and likely bugs; formatting stays as written.
select = ["E9", "F", "B"]
# FastAPI declares parameters with File()/Depends() defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported by name and then injected as parameters.
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/embed_worker.py"]
